<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCB Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div>
            <h1>CCB Player</h1>
            <p id="assetMeta">Loading assets...</p>
          </div>
        </div>

        <label class="field">
          <span>Asset</span>
          <select id="assetSelect"></select>
        </label>

        <label class="field">
          <span>Sequence</span>
          <select id="sequenceSelect"></select>
        </label>

        <div class="transport" aria-label="Playback controls">
          <button id="playButton" type="button" title="Play or pause">Pause</button>
          <button id="restartButton" type="button" title="Restart sequence">Restart</button>
        </div>

        <label class="field">
          <span>Time</span>
          <input id="timeSlider" type="range" min="0" max="1" step="0.001" value="0" />
        </label>

        <div class="readout">
          <span id="timeText">0.000s</span>
          <span id="fpsText">0 fps</span>
        </div>

        <label class="check">
          <input id="fitToggle" type="checkbox" checked disabled />
          <span>Fixed animal scale</span>
        </label>

        <label class="field">
          <span>Zoom</span>
          <input id="zoomSlider" type="range" min="0.2" max="4" step="0.05" value="1" />
        </label>

        <div class="stats" id="statsText"></div>
      </aside>

      <section class="stage">
        <canvas id="stageCanvas" width="1200" height="900"></canvas>
      </section>
    </main>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
